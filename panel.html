<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Schema Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      background: #0e639c;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .tb-btn:hover { background: #1177bb; }
    .tb-btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

    #schema-count { font-size: 12px; color: #9cdcfe; font-weight: 500; }

    #view-toggle {
      margin-left: auto;
      display: flex;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 3px 10px;
      background: transparent;
      color: #9d9d9d;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
    }
    .toggle-btn.active { background: #0e639c; color: #fff; }

    /* ── Content ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b6b6b;
      gap: 8px;
    }
    #empty-state svg { width: 40px; height: 40px; fill: #3c3c3c; }

    .schema-card {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 5px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .schema-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
      cursor: pointer;
      user-select: none;
    }
    .schema-card-header:hover { background: #333; }
    .schema-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: #0e4d78;
      color: #9cdcfe;
    }
    .schema-source-label { font-size: 11px; color: #6b6b6b; }
    .collapse-icon { margin-left: auto; color: #6b6b6b; font-size: 10px; transition: transform 0.15s; }
    .schema-card.collapsed .collapse-icon { transform: rotate(-90deg); }
    .schema-card.collapsed .schema-card-body { display: none; }
    .schema-card-body { padding: 12px; }
    pre.json-view {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
      height: auto;
      overflow-x: auto;  /* scroll horizontally for long lines, grow vertically */
    }
    .json-key    { color: #9cdcfe; }
    .json-string { color: #ce9178; }
    .json-number { color: #b5cea8; }
    .json-bool   { color: #569cd6; }
    .json-null   { color: #569cd6; }
    .error-card .schema-card-header { background: #4a1515; border-color: #7a2222; }
    .error-card { background: #3b1111; border-color: #7a2222; }
    .error-message { color: #f48771; font-size: 12px; font-family: monospace; }

    /* ── Footer ── */
    #footer {
      flex-shrink: 0;
      padding: 5px 12px;
      background: #252526;
      border-top: 1px solid #3c3c3c;
      font-size: 11px;
      color: #6b6b6b;
    }
    #footer a { color: #e75e5e; text-decoration: none; }
    #footer a:hover { text-decoration: underline; }
    .footer-sep { margin: 0 4px; color: #444; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e1e1e; }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" id="refresh-btn">
      <svg viewBox="0 0 16 16"><path d="M13.5 2.5A7 7 0 1 0 15 8h-1.5A5.5 5.5 0 1 1 10.5 3.3V2h-1.5V.5h4V4h-1.5V2.5z"/></svg>
      Refresh
    </button>
    <span id="schema-count"></span>
    <div id="view-toggle">
      <button class="toggle-btn active" data-view="formatted">Formatted</button>
      <button class="toggle-btn"        data-view="raw">Raw</button>
    </div>
  </div>

  <!-- Schema cards -->
  <div id="content">
    <div id="empty-state">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <p>Click Refresh to scan for Schema.org data</p>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer">
    Built by <a href="https://aperitifagency.com.au/seo/llm-ai-optimisation/" target="_blank" rel="noopener">Aperitif Agency</a>
    <span class="footer-sep">·</span> LLM &amp; AI Optimisation - get cited by ChatGPT, Claude &amp; Grok
  </div>

  <script src="panel.js"></script>
</body>
</html>
