<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #300b0b;
  }
  #wrap span { font-family: Menlo, monospace; font-weight: bold; color: #e75e5e; }
  #wrap img { display: block; }
</style>
</head>
<body>
<script>
  // Aperitif Agency branding: real hexagon-A mark (aperitif-mark.png, from
  // aperitifagency.com.au favicon) between code braces, on the site's maroon.
  // At 16px the braces are unreadable, so the mark fills the whole canvas.
  const size = parseInt(new URLSearchParams(location.search).get('size') || '128', 10);
  const tiny = size <= 16;

  if (tiny) {
    document.body.innerHTML = `<img src="aperitif-mark.png"
      style="display:block;width:${size}px;height:${size}px">`;
  } else {
    const s = size / 128;
    document.body.innerHTML = `
      <div id="wrap" style="width:${size}px;height:${size}px;border-radius:${Math.round(26*s)}px">
        <span style="font-size:${Math.round(58*s)}px">{</span>
        <img src="aperitif-mark.png"
             style="width:${Math.round(66*s)}px;height:${Math.round(66*s)}px;margin:0 ${Math.round(-1*s)}px">
        <span style="font-size:${Math.round(58*s)}px">}</span>
      </div>`;
  }
</script>
</body>
</html>
