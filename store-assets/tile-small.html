<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px;
    background: linear-gradient(135deg, #1d0404 0%, #300b0b 55%, #451414 130%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    overflow: hidden;
  }
  .icon { display: flex; align-items: center; }
  .icon span { font-family: Menlo, monospace; font-weight: bold; font-size: 46px; color: #e75e5e; }
  .icon img { width: 58px; height: 58px; display: block; margin: 0 2px; }
  h1 { font-size: 27px; font-weight: 700; color: #f8f7f6; letter-spacing: -0.3px; }
  p  { font-size: 14.5px; color: #e78f8f; }
  .row { display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>
  <div class="row">
    <div class="icon">
      <span>{</span><img src="aperitif-mark.png" alt=""><span>}</span>
    </div>
    <div>
      <h1>Schema Checker</h1>
      <p>Check JSON-LD &amp; Microdata in DevTools</p>
    </div>
  </div>
</body>
</html>
